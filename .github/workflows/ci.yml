name: Verify restart contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    name: Core ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not native" -ra --junitxml=core-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: core-junit.xml
  native:
    name: Native checkpoints / Linux Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test,native]"
      - run: python -m pytest -m native -ra --junitxml=native-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux
          path: native-junit.xml
  package:
    name: Clean wheel, offline replay and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build ruff==0.14.0
      - run: ruff check src tests experiments
      - run: ruff format --check src tests experiments
      - run: python -m build
      - shell: bash
        run: |
          python -m venv clean
          clean/bin/pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/clean/bin/restartwitness" example --steps 8 --out study.json
          "$GITHUB_WORKSPACE/clean/bin/restartwitness" run study.json --cuts '[0,4,4,8]' --out evidence
          "$GITHUB_WORKSPACE/clean/bin/restartwitness" verify evidence
          "$GITHUB_WORKSPACE/clean/bin/restartwitness" report evidence --out report.html
          "$GITHUB_WORKSPACE/clean/bin/restartwitness" replay evidence --out replayed --trust-driver
          "$GITHUB_WORKSPACE/clean/bin/python" -I "$GITHUB_WORKSPACE/tests/independent_check.py" evidence
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
